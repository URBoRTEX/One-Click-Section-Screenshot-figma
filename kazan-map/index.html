  <style>
    :root{--peek:126px;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#dce3e8;overflow:hidden}button,a{font:inherit}button{touch-action:manipulation}#map{position:fixed;inset:0;z-index:1;background:#dce3e8}
    .top{position:fixed;z-index:1000;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:6px;border-radius:16px;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(15,23,42,.16)}.top::-webkit-scrollbar{display:none}.top button{flex:0 0 auto;border:0;border-radius:11px;padding:10px 12px;background:#eef2f6;color:#111827;font-weight:800;font-size:12px}.top button.on{background:#111827;color:#fff}

    .sheet{position:fixed;z-index:1001;left:0;right:0;bottom:0;height:min(68dvh,620px);height:min(68svh,620px);display:flex;flex-direction:column;background:rgba(255,255,255,.98);backdrop-filter:blur(18px);border-radius:22px 22px 0 0;box-shadow:0 -12px 38px rgba(15,23,42,.18);transform:translate3d(0,calc(100% - var(--peek)),0);transition:transform .24s cubic-bezier(.22,.8,.25,1);padding-bottom:var(--safe);will-change:transform}.sheet.open{transform:translate3d(0,0,0)}.handle{flex:0 0 28px;height:28px;border:0;background:transparent;display:grid;place-items:center}.handle:after{content:"";width:52px;height:5px;border-radius:9px;background:#cbd5e1}

    .list{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 22px}.stop{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:11px 7px;border-bottom:1px solid #eef0f3;border-radius:12px}.stop.selected-stop{background:#fff1f2;box-shadow:inset 0 0 0 1px #fecdd3}.n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900}.stop b{display:block;font-size:14px;line-height:1.25}.stop span{display:block;font-size:11px;color:#667085;margin-top:3px;line-height:1.3}.row-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}.mini-route,.popup-route{border:0;border-radius:8px;background:#2563eb;color:#fff;padding:7px 10px;font-size:11px;font-weight:800}
    .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.links a{font-size:11px;font-weight:800;text-decoration:none;color:#111827;background:#eef2f6;padding:6px 8px;border-radius:8px}.warn{margin-top:7px;color:#9a3412;font-size:11px}.leaflet-control-zoom{margin-top:126px!important}.leaflet-popup-content-wrapper{border-radius:15px}.leaflet-popup-content{margin:13px;min-width:220px}.popup-route{display:block;width:100%;margin-top:10px}
    .marker{background:none;border:0}.marker i{display:grid;place-items:center;width:32px;height:32px;border:3px solid #fff;border-radius:50%;color:#fff;font-style:normal;font-size:10px;font-weight:900;box-shadow:0 5px 14px rgba(15,23,42,.35);transition:.18s}.marker i.selected{width:40px;height:40px;border-width:4px;box-shadow:0 0 0 7px rgba(239,68,68,.2),0 7px 18px rgba(15,23,42,.38);font-size:11px}.lab{background:rgba(255,255,255,.94)!important;border:0!important;border-radius:8px!important;padding:4px 6px!important;box-shadow:0 4px 12px rgba(15,23,42,.14)!important;font-size:10px!important;font-weight:800!important}.lab:before{display:none}
    .user-location{background:none;border:0}.user-location span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(37,99,235,.18);animation:locationPulse 1.8s infinite}.user-location i{width:15px;height:15px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 2px 8px rgba(15,23,42,.35)}@keyframes locationPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}50%{box-shadow:0 0 0 13px rgba(37,99,235,0)}}@keyframes pulse{50%{opacity:.45}}
    .route-card{display:none!important}
